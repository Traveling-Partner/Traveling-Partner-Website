# Example nginx config for DigitalOcean Droplet (static site from `out/` after npm run build).
# Copy to /etc/nginx/sites-available/traveling-partner and enable the site.

server {
    listen 80;
    listen [::]:80;
    server_name traveling-partner.com www.traveling-partner.com;

    root /var/www/traveling-partner/out;
    index index.html;

    # Optional: proxy API through your domain (avoids CORS). Uncomment if needed.
    # location /website/ {
    #     proxy_pass http://45.55.78.67:8080/api/website/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    # }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    location ~ ^/blog/([0-9]+)/?$ {
        try_files /blog/$1.html =404;
    }

    location = /blog {
        try_files /blog.html =404;
    }
}
