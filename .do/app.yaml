# DigitalOcean App Platform — static site (connect this repo in DO dashboard).
# Settings must match: build = npm run build, output = out

name: traveling-partner-website

static_sites:
  - name: web
    build_command: npm run build
    output_dir: out
    environment_slug: node-js
    envs:
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://api.traveling-partner.com/api
        scope: BUILD_TIME
