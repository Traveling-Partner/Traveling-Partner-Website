# Verifies static export and blog pages on push/PR.
# DigitalOcean deploys separately — this check must pass before merging.

name: Build static site

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_BASE_URL: https://api.traveling-partner.com/api
      NEXT_PUBLIC_SITE_URL: https://traveling-partner.com

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn

      - run: yarn install --frozen-lockfile

      - run: yarn build

      - name: Verify Open Graph tags on blog pages
        run: grep -l "og:image" out/blog/*.html | head -3

      - uses: actions/upload-artifact@v4
        with:
          name: static-out
          path: out/
          retention-days: 7
