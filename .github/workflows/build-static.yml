# Runs on every push — verifies static export and blog pages generate.
# Deploy the `out` folder to DigitalOcean (App Platform auto-deploy or upload to Droplet).

name: Build static site

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_BASE_URL: https://api.traveling-partner.com/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: List generated blog pages
        run: ls -la out/blog/*.html 2>/dev/null || ls -la out/blog/

      - uses: actions/upload-artifact@v4
        with:
          name: static-out
          path: out/
          retention-days: 7
