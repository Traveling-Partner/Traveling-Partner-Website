# Verifies static export and blog pages on push/PR.
# DigitalOcean deploys separately — this check must pass before merging.

name: Build static site

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_BASE_URL: https://api.traveling-partner.com/api
      NEXT_PUBLIC_SITE_URL: https://traveling-partner.com

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn

      - run: yarn install --frozen-lockfile

      - run: yarn build

      - name: Verify blog static export
        run: |
          test -f out/blog-list.json || (echo "Missing out/blog-list.json" && exit 1)
          test -f out/blog/detail.html || (echo "Missing out/blog/detail.html" && exit 1)
          # At least one per-id page with Open Graph image (LinkedIn share previews)
          ls out/blog/*.html 2>/dev/null | grep -E '/[0-9]+\.html$' | head -1 | grep -q . \
            || (echo "Missing out/blog/{id}.html — generateStaticParams failed" && exit 1)
          SAMPLE=$(ls out/blog/[0-9]*.html 2>/dev/null | head -1)
          grep -q 'og:image' "$SAMPLE" || (echo "Missing og:image in $SAMPLE" && exit 1)
          grep -q 'og:title' "$SAMPLE" || (echo "Missing og:title in $SAMPLE" && exit 1)
          ls -la out/blog-list.json out/blog/detail.html "$SAMPLE" 2>/dev/null || true
          echo "OG sample from $SAMPLE:"
          grep -E 'og:(title|image)' "$SAMPLE" | head -5

      - uses: actions/upload-artifact@v4
        with:
          name: static-out
          path: out/
          retention-days: 7
